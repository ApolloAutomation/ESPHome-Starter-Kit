substitutions:
  name: apollo-esk-1
  version: "25.1.29.1"
  device_description: ${name} made by Apollo Automation - version ${version}.

esphome:
  name: "${name}"
  friendly_name: Apollo ESK-1
  comment: Apollo ESK-1 Starter Kit
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.ESK-1"
    version: "${version}"

  min_version: 2023.11.1

  on_shutdown:
    - light.turn_off: rgb_light
    - switch.turn_off: accessory_power

  on_boot:
    - priority: 500
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(id(deep_sleep_sleep_duration).state * 60 * 60 * 1000);
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                  id(deep_sleep_1).prevent_deep_sleep();

globals:
  - id: songCycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: motionColorIndex
    type: int
    restore_value: no
    initial_value: '0'

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: github://ApolloAutomation/esphome-battery-component
    components: [max17048]

api:
  id: api_server
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - lambda: |-
                id(reportAllValues).execute();
            - delay: 2s
            - deep_sleep.enter:
                id: deep_sleep_1

#########
######### Buzzer Module Start
#########
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

output:
  - platform: ledc
    pin: GPIO18
    id: buzzer
rtttl:
  id: rtttl_buzzer
  output: buzzer
#########
######### Buzzer Module End
#########

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ap:
    ssid: "Apollo ESK-1 Hotspot"

logger:

web_server:
  port: 80
  version: 3

captive_portal:

i2c:
  #- id: i2c_bus_1
  #  sda: GPIO21
  #  scl: GPIO20
  - id: i2c_bus_2
    sda: GPIO1
    scl: GPIO0
    scan: true


# one_wire:
#   - platform: gpio
#     pin: GPIO6

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 24h
  run_duration: 90s

number:
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 24
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "h"
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 60 * 1000);

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected

  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();
#########
######### PIR Module Start
#########

  - platform: gpio
    name: "PIR"
    pin:
      number: GPIO3
      mode:
        input: true
        pulldown: false
    id: io_pir
    device_class: motion
    on_press:
      then:
        - script.execute: motionColor
    on_release:
      then:
        - script.execute: startThermometer

#########
######### PIR Module End
#########

#########
######### Button Module Start
#########

  - platform: gpio
    id: button_1
    name: "Button 1"
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - script.stop: song0
        - script.stop: song1
        - script.stop: song2
        - script.stop: song3
        - script.stop: song4
        - script.stop: song5
        - script.execute: playSongCycle

#########
######### Button Module End
#########

#########
######### Boot Button Module Start
#########

  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_multi_click:
      - timing:
          - ON for at least 8s
        then:
          - switch.turn_on: factory_reset_switch
      - timing:
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - script.execute: rainbowCircle
      - timing:
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - script.execute: startThermometer
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - script.execute: statusCheck

#########
######### Boot Button Module End
#########

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

#########
######### AHT Module Start
#########
  - platform: aht10
    variant: AHT20
    id: aht_20
    temperature:
      name: "Temperature"
      id: aht_temperature
    humidity:
      name: "Humidity"
      id: aht_humidity
    update_interval: 1s

#########
######### AHT Module End
#########

#########
######### SHT30 Module Start
#########
  # - platform: sht3xd
  #  id: sht30
  #  temperature:
  #    name: "SHT Temperature"
  #    id: sht_temperature
  #  humidity:
  #    name: "SHT Relative Humidity"
  #    id: sht_humidity
  #  update_interval: 60s
  #  i2c_id: i2c_bus_2
#########
