      id: accel_z
    gyroscope_x:
      name: "Gyroscope X"
      id: gyro_x
    gyroscope_y:
      name: "Gyroscope Y"
      id: gyro_y
    gyroscope_z:
      name: "Gyroscope Z"
      id: gyro_z
    temperature:
      name: "BMI160 Temperature"
      id: bmi160_temperature
#########
######### BMI160 Module End
#########

#########
######### MiCS Module Start
#########
  - platform: mics_4514
    id: mics4514
    nitrogen_dioxide:
      name: Nitrogen Dioxide
    carbon_monoxide:
      name: Carbon Monoxide
    hydrogen:
      name: Hydrogen
    ethanol:
      name: Ethanol
    methane:
      name: Methane
    ammonia:
      name: Ammonia
    update_interval: 10s
    i2c_id: i2c_bus_2
#########
######### MiCS Module End
#########

#########
######### Dallas Probe Module Start
#########
#  - platform: dallas_temp
#    name: "Temperature Probe"
#    id: temp_probe
#    update_interval: 60s
#########
######### Dallas Probe Module End
#########

  - platform: max17048
    id: max_17048
    battery_voltage:
      name: Battery Voltage
      id: batt_v
    battery_level:
      name: Battery Level
      id: batt_pct
      filters:
        - lambda: |
            if (x > 100) return 100;
            else return (x);

switch:
  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: gpio
    pin: GPIO4
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Board Light"
    pin: GPIO5
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 1
    rmt_symbols: 48
    rgb_order: grb

#########
######### LED Module Start
#########
  - platform: esp32_rmt_led_strip
    id: rgb_module
    name: "RGB Module Light"
    pin: GPIO14
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 10
    rmt_symbols: 48
    rgb_order: grb
    effects:
      - addressable_lambda:
          name: "Thermometer"
          update_interval: 200ms
          lambda: |-
            float temp = id(aht_temperature).state;
            if (isnan(temp)) return;

            static float last_ratio = -1.0;
            float min_temp = 21.0;
            float max_temp = 27.0;
            float ratio = (temp - min_temp) / (max_temp - min_temp);
            if (ratio < 0) ratio = 0;
            if (ratio > 1) ratio = 1;

            // Only redraw if ratio changed
            if (abs(ratio - last_ratio) < 0.01 && last_ratio >= 0) return;
            last_ratio = ratio;

            // How many LEDs to light (0-10)
            float fill = ratio * 10.0;

            for (int i = 0; i < 10; i++) {
              if (i < (int)fill) {
                float pos = (float)i / 9.0;
                uint8_t r, g, b;
                if (pos < 0.25) {
                  float t = pos / 0.25;
                  r = 0; g = (uint8_t)(255 * t); b = 255;
                } else if (pos < 0.5) {
                  float t = (pos - 0.25) / 0.25;
                  r = 0; g = 255; b = (uint8_t)(255 * (1 - t));
                } else if (pos < 0.75) {
                  float t = (pos - 0.5) / 0.25;
                  r = (uint8_t)(255 * t); g = 255; b = 0;
                } else {
                  float t = (pos - 0.75) / 0.25;
                  r = 255; g = (uint8_t)(255 * (1 - t)); b = 0;
                }
                it[i] = Color(r, g, b);
              } else {
                it[i] = Color(0, 0, 0);
              }
            }
      - addressable_rainbow:
          name: "Rainbow Circle"
          speed: 30
          width: 10
      - addressable_color_wipe:
          name: "Rickroll"
          colors:
            - red: 100%
              green: 0%
              blue: 50%
              num_leds: 3
            - red: 80%
              green: 0%
              blue: 80%
              num_leds: 3
            - red: 100%
              green: 30%
              blue: 0%
              num_leds: 2
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 2
          add_led_interval: 100ms
          reverse: false
      - addressable_color_wipe:
          name: "Mario"
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 5
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 5
          add_led_interval: 100ms
          reverse: false
      - addressable_twinkle:
          name: "Cantina"
          twinkle_probability: 45%
          progress_interval: 15ms
      - addressable_random_twinkle:
          name: "Scatman"
          twinkle_probability: 70%
          progress_interval: 10ms
      - addressable_flicker:
          name: "Imperial March"
          intensity: 30%
          update_interval: 50ms
      - addressable_color_wipe:
          name: "Take On Me"
          colors:
            - red: 0%
              green: 50%
              blue: 100%
              num_leds: 3
            - red: 60%
              green: 0%
              blue: 100%
              num_leds: 3
            - red: 100%
              green: 0%
              blue: 60%
              num_leds: 2
            - red: 0%
              green: 80%
              blue: 100%
              num_leds: 2
          add_led_interval: 80ms
          reverse: false

#########
######### LED Module End
#########



script:
  - id: playSongCycle
    mode: restart
    then:
      - light.turn_off: rgb_module
      - lambda: |-
          // Stop any currently playing song
          id(rtttl_buzzer).stop();
      - delay: 100ms
      - lambda: |-
          int song = id(songCycleCounter) % 6;
          id(songCycleCounter)++;
          switch(song) {
            case 0: id(song0).execute(); break;
            case 1: id(song1).execute(); break;
            case 2: id(song2).execute(); break;
            case 3: id(song3).execute(); break;
            case 4: id(song4).execute(); break;
            case 5: id(song5).execute(); break;
          }

  - id: song0
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          effect: "Rickroll"
      - rtttl.play:
          rtttl: "GiveYouUp:d=4,o=5,b=200:8g,8a,8c6,8a,e6,8p,e6,8p,d.6,p,8p,8g,8a,8c6,8a,d6,8p,d6,8p,c6,8b,a.,8g,8a,8c6,8a,2c6,d6,b,a,g.,8p,g,2d6,2c.6,p,8g,8a,8c6,8a,e6,8p,e6,8p,d.6,p,8p,8g,8a,8c6,8a,2g6,b,c.6,8b,a,8g,8a,8c6,8a,2c6,d6,b,a,g.,8p,g,2d6,2c.6"
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: song1
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          effect: "Mario"
      - rtttl.play:
          rtttl: "Mario:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6,8p,8g,8p,8c6,16p,8g,16p,8e,16p,8a,8b,16a#,8a,16g.,16e6,16g6,8a6,16f6,8g6,8e6,16c6,16d6,8b,16p"
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: song2
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 100%
          red: 60%
          green: 0%
          blue: 100%
          effect: "Cantina"
      - rtttl.play:
          rtttl: "Cantina:d=8,o=5,b=250:a,p,d6,p,a,p,d6,p,a,d6,p,a,p,g#,4a,a,g#,a,4g,f#,g,f#,4f.,d.,16p,4p.,a,p,d6,p,a,p,d6,p,a,d6,p,a,p,g#,a,p,g,p,4g.,f#,g,p,c6,4a#,4a,4g"
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: song3
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          effect: "Take On Me"
      - rtttl.play:
          rtttl: "TakeOnMe:d=4,o=5,b=160:8f#,8f#,8f#,8d,8p,8b4,8p,8e,8p,8e,8p,8e,8g#,8g#,8a,8b,8a,8a,8a,8e,8p,8d,8p,8f#,8p,8f#,8p,8f#,8e,8e,8f#,8e"
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: song4
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          effect: "Imperial March"
      - rtttl.play:
          rtttl: "Imperial:d=4,o=5,b=100:e,e,e,8c,16p,16g,e,8c,16p,16g,e,p,b,b,b,8c6,16p,16g,d#,8c,16p,16g,e,8p"
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: song5
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 100%
          effect: "Scatman"
      - rtttl.play:
          rtttl: "Scatman:d=16,o=5,b=200:8b,b,32p,8b,b,32p,8b,2d6,p,c#6.,p.,8d6,p,c#6,8b,p,8f#,2p.,c#6,8p,d6.,p.,c#6,b,8p,8f#,2p,32p,2d6,p,c#6,8p,d6.,p.,c#6,a.,p.,8e,2p.,c#6,8p,d6.,p.,c#6,b,8p,8b,b,32p,8b,b,32p,8b,2d6,p,c#6.,p.,8d6,p,c#6,8b,p,8f#,2p.,c#6,8p,d6.,p.,c#6,b,8p,8f#,2p,32p,2d6,p,c#6,8p,d6.,p.,c#6,a.,p.,8e,2p.,c#6,8p,d6.,p.,c#6,a,8p,8e,2p,32p,f#6.,p.,b.,p."
      - delay: 500ms
      - wait_until:
          lambda: 'return !id(rtttl_buzzer).is_playing();'
      - script.execute: startThermometer

  - id: startThermometer
    mode: restart
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          effect: "Thermometer"

  - id: motionColor
    mode: restart
    then:
      - lambda: |-
          int color = id(motionColorIndex) % 7;
          id(motionColorIndex)++;
          auto call = id(rgb_module).turn_on();
          call.set_brightness(0.5);
          call.set_transition_length(0);
          switch(color) {
            case 0: call.set_rgb(1.0, 0.0, 0.0); break;   // Red
            case 1: call.set_rgb(0.0, 1.0, 0.0); break;   // Green
            case 2: call.set_rgb(0.0, 0.0, 1.0); break;   // Blue
            case 3: call.set_rgb(1.0, 1.0, 0.0); break;   // Yellow
            case 4: call.set_rgb(1.0, 0.0, 1.0); break;   // Purple
            case 5: call.set_rgb(0.0, 1.0, 1.0); break;   // Cyan
            case 6: call.set_rgb(1.0, 0.5, 0.0); break;   // Orange
          }
          call.perform();

  - id: rainbowCircle
    then:
      - light.turn_on:
          id: rgb_module
          brightness: 50%
          effect: "Rainbow Circle"

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light

  - id: reportAllValues
    then:
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      # - component.update: sht30
      - component.update: sht41
      - component.update: sen55
      - component.update: mics4514
      - component.update: bmi160_imu
      # - component.update: temp_probe
      - component.update: max_17048
